# Generates the contribution snake animation and pushes SVGs to the `output` branch.
# Referenced in README.md from:
#   https://raw.githubusercontent.com/SamAlex-22/SamAlex-22/output/github-snake-dark.svg
#   https://raw.githubusercontent.com/SamAlex-22/SamAlex-22/output/github-snake.svg
#
# SETUP: Repo Settings → Actions → General → Workflow permissions → "Read and write permissions"
# First run: Go to Actions tab → "Generate Snake" → "Run workflow"

name: Generate Snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: SamAlex-22
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          clean: false
