# Generates GitHub profile metrics and pushes SVGs to the `output` branch.
# Uses lowlighter/metrics — the most reliable GitHub profile stats generator.
#
# Referenced in README.md from:
#   https://raw.githubusercontent.com/SamAlex-22/SamAlex-22/output/metrics-base.svg
#   https://raw.githubusercontent.com/SamAlex-22/SamAlex-22/output/metrics-languages.svg

name: Profile Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate base stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: SamAlex-22
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Asia/Kolkata
          config_display: large
          filename: metrics-base.svg
          output_action: commit
          committer_branch: output

      - name: Generate language stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: SamAlex-22
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_threshold: 2%
          config_timezone: Asia/Kolkata
          filename: metrics-languages.svg
          output_action: commit
          committer_branch: output
