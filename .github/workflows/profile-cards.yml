# Generates GitHub Profile Summary Cards in the Cyberpunk 2077 theme and commits them to main.
# Cards are referenced in README.md from:
#   https://raw.githubusercontent.com/SamAlex-22/SamAlex-22/main/profile-summary-card-output/2077/*.svg

name: Profile Summary Cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: SamAlex-22
          BRANCH_NAME: main
          UTC_OFFSET: 5.50
