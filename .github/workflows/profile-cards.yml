# Generates GitHub Profile Summary Cards and pushes them to the `output` branch.
# Cards are referenced in README.md from:
#   https://raw.githubusercontent.com/SamAlex-22/SamAlex-22/output/profile-summary-card-output/2077/*.svg
#
# SETUP: Repo Settings → Actions → General → Workflow permissions → "Read and write permissions"
# First run: Go to Actions tab → "Profile Summary Cards" → "Run workflow"

name: Profile Summary Cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: SamAlex-22
          BRANCH_NAME: output
          UTC_OFFSET: 5.50
